name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version to validate and build without publishing
        required: true
        default: v2.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  UV_LOCKED: "1"

jobs:
  ci:
    name: Reuse required CI gates
    uses: ./.github/workflows/ci.yml

  security:
    name: Reuse required security gates
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  docs:
    name: Reuse required documentation gates
    uses: ./.github/workflows/docs-ci.yml

  e2e:
    name: Reuse required Docker lifecycle gate
    uses: ./.github/workflows/e2e.yml

  version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Match tag, package metadata, and runtime constant
        run: python scripts/check_release_version.py "${RELEASE_TAG}"

      - name: Require candidate to come from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git fetch origin "${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          python scripts/check_release_source.py --default-branch "${DEFAULT_BRANCH}"

  python-artifacts:
    name: Build wheel and source distribution
    needs: [ci, security, docs, e2e, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build canonical Python artifacts
        run: uv build

      - name: Verify wheel contents
        run: uv run --extra build python scripts/verify_wheel.py dist/*.whl

      - name: Attest Python artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      - name: Upload Python artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-python
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  bundles:
    name: Bundle (${{ matrix.name }})
    needs: [ci, security, docs, e2e, version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-latest
          - name: macos-amd64
            runner: macos-15-intel
          - name: windows-amd64
            runner: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked bundle environment
        run: uv sync --locked --extra build

      - name: Build transparent onedir bundle
        shell: bash
        run: >-
          uv run pyinstaller
          --onedir
          --name nesk
          --collect-all luminesk_cli
          --collect-all platformdirs
          --collect-all prompt_toolkit
          --runtime-hook scripts/bundle_runtime_hook.py
          --exclude-module tkinter
          luminesk_cli/__main__.py

      - name: Smoke test bundle
        shell: bash
        run: |
          EXECUTABLE="dist/nesk/nesk"
          if [[ "$RUNNER_OS" == "Windows" ]]; then EXECUTABLE="${EXECUTABLE}.exe"; fi
          "$EXECUTABLE" --_bundle-check
          "$EXECUTABLE" --version
          "$EXECUTABLE" --help
          "$EXECUTABLE" catalog status --json

      - name: Archive bundle
        run: >-
          uv run python scripts/archive_bundle.py
          "dist/nesk"
          "artifacts/luminesk-${{ matrix.name }}.zip"

      - name: Exercise installers with the built onedir application
        env:
          LUMINESK_TEST_BUNDLE: dist/nesk
        run: uv run --extra dev pytest tests/test_installers.py --strict-config --strict-markers -W error::ResourceWarning

      - name: Attest bundle artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: artifacts/*

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  verify-release-assets:
    name: Verify complete release asset contract
    needs: [python-artifacts, bundles]
    runs-on: ubuntu-latest
    steps:
      - name: Check out verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download every release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Download runtime SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-runtime-sbom
          path: release-assets

      - name: Generate and verify release checksums
        shell: bash
        run: |
          (cd release-assets && sha256sum * > SHA256SUMS)
          python scripts/verify_release_assets.py release-assets

      - name: Upload verified release asset set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [python-artifacts, bundles, verify-release-assets]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-python
          path: dist

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [python-artifacts, bundles, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release-assets
          path: release-assets

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES=(--generate-notes)
          if [[ -f "docs/releases/${RELEASE_TAG}.md" ]]; then
            NOTES=(--notes-file "docs/releases/${RELEASE_TAG}.md")
          fi
          PRERELEASE=()
          if [[ "${RELEASE_TAG}" =~ (a|b|rc)[1-9][0-9]*$ ]]; then
            PRERELEASE+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Luminesk-CLI ${RELEASE_TAG}" \
            "${NOTES[@]}" \
            "${PRERELEASE[@]}"
