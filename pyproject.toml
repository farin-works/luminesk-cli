[project]
name = "luminesk-cli"
version = "2.0.2"
description = "Docker-first Minecraft server recipe composer for Java and Bedrock."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Taskov1ch", email = "sudo.taskov1ch@gmail.com" }]
keywords = [
  "cli",
  "docker",
  "java",
  "minecraft",
  "minecraft-server",
  "bedrock",
  "server-management",
  "tool",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "defusedxml>=0.7.1",
  "filelock>=3.20.3",
  "httpcore>=1.0.9,<2",
  "httpx>=0.28.1",
  "platformdirs>=4.10.0",
  "prompt-toolkit>=3.0.52,<4",
  "rich>=15.0.0",
]

[project.urls]
Homepage = "https://luminesk.taskov1ch.xyz"
Issues = "https://github.com/task-v1/luminesk-cli/issues"
Repository = "https://github.com/task-v1/luminesk-cli.git"

[project.scripts]
nesk = "luminesk_cli.main:main"

[project.optional-dependencies]
build = ["packaging>=26.2", "pyinstaller>=6.21.0"]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=5.0.0",
  "ruff>=0.15.20",
  "ty>=0.0.86",
  "types-defusedxml>=0.7.0.20250822",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
exclude = ["build/", "dist/"]

[tool.ty.environment]
# Check cross-platform code and Unix-only release scripts consistently on every host.
python-platform = "all"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["luminesk_cli*"]

[tool.uv]
package = true
