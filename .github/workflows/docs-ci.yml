name: Documentation CI

on:
  workflow_call:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs-ci.yml"
  push:
    branches: [main, "2.0"]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs-ci.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Type check and build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install locked docs dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Audit docs dependencies
        run: pnpm --dir docs audit:security

      - name: Reject unsafe image formats
        run: pnpm --dir docs check:images

      - name: Type check docs application
        run: pnpm --dir docs typecheck

      - name: Build docs with broken-link checks
        run: pnpm --dir docs build

      - name: Upload rendered site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: documentation-site
          path: docs/build
          if-no-files-found: error
          retention-days: 7
