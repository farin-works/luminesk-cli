name: Docker E2E

on:
  workflow_call:
  push:
    branches: [main, "2.0"]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

concurrency:
  group: docker-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lifecycle:
    name: Install, start, readiness, and stop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked runtime
        run: uv sync --locked

      - name: Verify Docker daemon
        run: docker version

      - name: Run real Docker lifecycle smoke test
        run: uv run python scripts/docker_e2e.py

  official-catalog:
    name: Catalog update, discovery, and PaperMC lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked runtime
        run: uv sync --locked

      - name: Verify Docker daemon
        run: docker version

      - name: Run official catalog acceptance gate
        run: uv run python scripts/catalog_acceptance.py
